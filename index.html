<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Abuse Writer</title>
</head>
<body>
  <h2>Abuse Writer</h2>
  <p>you want to write abuse now</p>
  
  <input type="text" id="userInput" placeholder="write here...">
  <button onclick="showResult()">확인</button>

  <p id="result1"></p>
  <p id="result2"></p>

  <script>
    function showResult() {
      // 입력창에서 값을 가져옵니다.
      let n = document.getElementById("userInput").value;
      
      // 'write abuses: '를 지우고 변수 n(입력값)만 출력하게 수정했습니다.
      document.getElementById("result1").innerText = n; 
      document.getElementById("result2").innerText = "you are " + n;
    }
  </script>
</body>
</html>
